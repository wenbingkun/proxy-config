name: Config Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check required files and directories
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path

          ROOT = Path(".")
          required = [
              "rules",
              "quantumultx",
              "mihomo",
              "tests",
              "scripts",
              "README.md",
              "AGENTS.md",
              ".gitignore",
              "mihomo/verge/config.yaml",
              "mihomo/verge/config-single.yaml",
              "mihomo/shellcrash/config-router.template.yaml",
              "mihomo/shellcrash/config-router-single.template.yaml",
              "mihomo/shellcrash/providers.env.example",
              "quantumultx/bootstrap.example.conf",
              "quantumultx/filter/repo.snippet",
              "loon/bootstrap.example.conf",
              "loon/rules/geoip_cn.list",
              "loon/plugins/GoofishAds.plugin",
              "loon/plugins/WeiboAds.plugin",
              "loon/plugins/Douban.plugin",
              "loon/plugins/Q-Search.plugin",
              "loon/plugins/General.plugin",
              "rules/local_rules.yaml",
              "scripts/build_rules.py",
              "scripts/build_router_config.py",
              "scripts/check_acceptance.py",
              "scripts/check_hygiene.py",
              "scripts/check_remote_resources.py",
              "scripts/check_reject_conflicts.py",
              "scripts/build_surge_modules.py",
              "surge/modules/rewrite.sgmodule",
              "surge/proxy-config.conf",
              "surge/bootstrap.example.conf",
              "surge/airport-dns.example.sgmodule",
              "surge/modules/home-direct.sgmodule",
              "surge/modules/home-direct-noblock.sgmodule",
              "surge/rules/reject_allow.list",
              "tests/test_surge_config.py",
              "tests/test_remote_resources.py",
              "mihomo/shellcrash/deploy.sh",
              "tests/test_deploy_shellcrash.py",
              "tests/test_shellcrash_override.py",
              "tests/test_rule_provider_scope.py",
              "tests/test_region_groups.py",
              "tests/test_steam_policy.py",
              "tests/test_loon_config.py",
              "tests/test_qx_config.py",
          ]
          missing = [p for p in required if not (ROOT / p).exists()]
          if missing:
              print("Missing required files/directories:")
              for p in missing:
                  print(f"  {p}")
              sys.exit(1)
          print(f"All {len(required)} required paths present.")
          EOF

      - name: Validate YAML syntax
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path
          import yaml

          ROOT = Path(".")
          configs = [
              Path("mihomo/verge/config.yaml"),
              Path("mihomo/verge/config-single.yaml"),
              Path("mihomo/shellcrash/config-router.template.yaml"),
              Path("mihomo/shellcrash/config-router-single.template.yaml"),
          ]
          rulesets = list(Path("mihomo/rules").glob("*.yaml"))
          sources = list(Path("rules").glob("*.yaml"))
          if not all(p.is_file() for p in configs) or not rulesets or not sources:
              print("YAML scan set is incomplete: missing Mihomo configs, mihomo/rules or rules")
              sys.exit(1)
          targets = configs + rulesets + sources
          errors = []
          for path in sorted(targets):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("YAML syntax errors:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print(f"YAML syntax OK ({len(targets)} files checked).")
          EOF

      - name: Check mihomo/verge/config.yaml has rule-providers
        run: |
          python - <<'EOF'
          import sys
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path("mihomo/verge/config.yaml").read_text(encoding="utf-8")) or {}
          providers = data.get("rule-providers")
          if not isinstance(providers, dict) or len(providers) == 0:
              print("mihomo/verge/config.yaml: 'rule-providers' missing or empty")
              sys.exit(1)
          print(f"mihomo/verge/config.yaml: {len(providers)} rule-providers defined.")
          EOF

      - name: Check generated files are up to date
        run: |
          python3 scripts/build_rules.py --check
          python3 scripts/build_router_config.py --check
          python3 scripts/build_surge_modules.py --check

      - name: Check repository hygiene and acceptance
        run: |
          python3 scripts/check_hygiene.py
          python3 scripts/check_acceptance.py
          python3 tests/test_region_groups.py
          python3 tests/test_remote_resources.py
          python3 tests/test_rule_provider_scope.py
          python3 tests/test_steam_policy.py
          python3 tests/test_loon_config.py
          python3 tests/test_qx_config.py
          python3 tests/test_surge_config.py
          python3 scripts/check_reject_conflicts.py --self-test

      - name: Check shell script syntax
        run: sh -n mihomo/shellcrash/deploy.sh

      - name: Test ShellCrash deployment transaction
        run: python3 tests/test_deploy_shellcrash.py

      - name: Validate configs with ShellCrash Mihomo
        run: |
          shellcrash_commit=71c21fa26d5a5f40e6c433234c415fa83b59b6b9
          core_sha256=2328466d4c25b9f9e6adc542b8335630b73d6bf9a50b31d3b9bf23ae694f2614
          mmdb_sha256=81dc10c4600d842ed25b482e27cff315b6112e1c268ceef563f4de532c3e4ef6
          modify_sha256=44a9dc3bde3f46b37bdd16858488a4b6470dd7e92f97c068bb4d720ab3c155f3
          mkdir -p /tmp/proxy-config-mihomo
          curl -fsSL "https://raw.githubusercontent.com/juewuy/ShellCrash/${shellcrash_commit}/bin/meta/clash-linux-amd64.tar.gz" -o /tmp/proxy-config-mihomo/core.tar.gz
          curl -fsSL "https://raw.githubusercontent.com/juewuy/ShellCrash/${shellcrash_commit}/bin/geodata/Country.mmdb" -o /tmp/proxy-config-mihomo/Country.mmdb
          curl -fsSL "https://raw.githubusercontent.com/juewuy/ShellCrash/${shellcrash_commit}/scripts/starts/clash_modify.sh" -o /tmp/proxy-config-mihomo/clash_modify.sh
          echo "${core_sha256}  /tmp/proxy-config-mihomo/core.tar.gz" | sha256sum -c -
          echo "${mmdb_sha256}  /tmp/proxy-config-mihomo/Country.mmdb" | sha256sum -c -
          echo "${modify_sha256}  /tmp/proxy-config-mihomo/clash_modify.sh" | sha256sum -c -
          tar -xzf /tmp/proxy-config-mihomo/core.tar.gz -C /tmp/proxy-config-mihomo
          chmod +x /tmp/proxy-config-mihomo/CrashCore
          /tmp/proxy-config-mihomo/CrashCore -t -d /tmp/proxy-config-mihomo -f mihomo/verge/config.yaml
          /tmp/proxy-config-mihomo/CrashCore -t -d /tmp/proxy-config-mihomo -f mihomo/verge/config-single.yaml
          /tmp/proxy-config-mihomo/CrashCore -t -d /tmp/proxy-config-mihomo -f mihomo/shellcrash/config-router.template.yaml
          /tmp/proxy-config-mihomo/CrashCore -t -d /tmp/proxy-config-mihomo -f mihomo/shellcrash/config-router-single.template.yaml
          python3 tests/test_shellcrash_override.py \
            --modify-script /tmp/proxy-config-mihomo/clash_modify.sh \
            --core /tmp/proxy-config-mihomo/CrashCore \
            --mmdb /tmp/proxy-config-mihomo/Country.mmdb
          python3 tests/test_shellcrash_override.py \
            --modify-script /tmp/proxy-config-mihomo/clash_modify.sh \
            --core /tmp/proxy-config-mihomo/CrashCore \
            --mmdb /tmp/proxy-config-mihomo/Country.mmdb \
            --template mihomo/shellcrash/config-router-single.template.yaml

  # Candidate router core: slim Mihomo v1.19.31 built from source with the same
  # parameters as the local reproducible build. Kept alongside the v1.19.17 job
  # until the router upgrade is accepted.
  validate-slim-core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build slim Mihomo v1.19.31 and check hash
        run: |
          mihomo_commit=ab405bad5beeeac8b003bb01f60f134f6df54471
          image='golang:1.26.8-alpine@sha256:8ac98ca534ac3f51e1f420a1dd2c15e74c75cfa0f23f3ad27eb5d7236c349a0c'
          core_sha256=1a5ecc949fddd757cc7655079f38e72ee681b602b00c3ed6fde9696f17c598d0
          mkdir -p /tmp/slim/src /tmp/slim/out
          git -C /tmp/slim/src init -q
          # Fetch the tag (not just the commit): Go derives the embedded module version from it.
          git -C /tmp/slim/src fetch -q --depth 1 https://github.com/MetaCubeX/mihomo.git refs/tags/v1.19.31:refs/tags/v1.19.31
          git -C /tmp/slim/src checkout -q v1.19.31
          test "$(git -C /tmp/slim/src rev-parse HEAD)" = "${mihomo_commit}"
          docker run --rm -v /tmp/slim/src:/src:ro -v /tmp/slim/out:/out -w /tmp \
            -e GOOS=linux -e GOARCH=amd64 -e GOAMD64=v1 -e CGO_ENABLED=0 -e GOFLAGS=-mod=readonly \
            -e GOTOOLCHAIN=local \
            "${image}" sh -c "
              set -e
              apk add --no-cache git >/dev/null
              cp -a /src /tmp/src && cd /tmp/src
              git config --global --add safe.directory /tmp/src
              go version
              go build -tags 'no_tailscale no_zerotier no_easytier no_fake_tcp' -trimpath \
                -ldflags \"-extldflags --static -X 'github.com/metacubex/mihomo/constant.Version=v1.19.31' -X 'github.com/metacubex/mihomo/constant.BuildTime=Mon Sep 14 11:59:30 UTC 2026' -w -s -buildid=\" \
                -o /out/CrashCore .
              chown $(id -u):$(id -g) /out/CrashCore
            "
          echo "${core_sha256}  /tmp/slim/out/CrashCore" | sha256sum -c -
          /tmp/slim/out/CrashCore -v

      - name: Validate configs with slim Mihomo
        run: |
          shellcrash_commit=71c21fa26d5a5f40e6c433234c415fa83b59b6b9
          mmdb_sha256=81dc10c4600d842ed25b482e27cff315b6112e1c268ceef563f4de532c3e4ef6
          modify_sha256=44a9dc3bde3f46b37bdd16858488a4b6470dd7e92f97c068bb4d720ab3c155f3
          curl -fsSL "https://raw.githubusercontent.com/juewuy/ShellCrash/${shellcrash_commit}/bin/geodata/Country.mmdb" -o /tmp/slim/out/Country.mmdb
          curl -fsSL "https://raw.githubusercontent.com/juewuy/ShellCrash/${shellcrash_commit}/scripts/starts/clash_modify.sh" -o /tmp/slim/out/clash_modify.sh
          echo "${mmdb_sha256}  /tmp/slim/out/Country.mmdb" | sha256sum -c -
          echo "${modify_sha256}  /tmp/slim/out/clash_modify.sh" | sha256sum -c -
          /tmp/slim/out/CrashCore -t -d /tmp/slim/out -f mihomo/verge/config.yaml
          /tmp/slim/out/CrashCore -t -d /tmp/slim/out -f mihomo/verge/config-single.yaml
          /tmp/slim/out/CrashCore -t -d /tmp/slim/out -f mihomo/shellcrash/config-router.template.yaml
          /tmp/slim/out/CrashCore -t -d /tmp/slim/out -f mihomo/shellcrash/config-router-single.template.yaml
          python3 tests/test_shellcrash_override.py \
            --modify-script /tmp/slim/out/clash_modify.sh \
            --core /tmp/slim/out/CrashCore \
            --mmdb /tmp/slim/out/Country.mmdb
          python3 tests/test_shellcrash_override.py \
            --modify-script /tmp/slim/out/clash_modify.sh \
            --core /tmp/slim/out/CrashCore \
            --mmdb /tmp/slim/out/Country.mmdb \
            --template mihomo/shellcrash/config-router-single.template.yaml
