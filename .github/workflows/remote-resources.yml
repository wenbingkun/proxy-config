name: Remote Resources

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Check depth
        required: true
        default: light
        type: choice
        options:
          - light
          - full

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check remote resources
        env:
          CHECK_MODE: ${{ inputs.mode || 'full' }}
        run: python3 scripts/check_remote_resources.py --mode "$CHECK_MODE"
