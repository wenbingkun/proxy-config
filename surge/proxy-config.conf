[Rule]
# The REJECT lists and the home SSID rule are in surge/modules/home-direct.sgmodule; module rules
# go above these. Order below follows loon/bootstrap.example.conf [Remote Rule].
# Loon keeps this in its local [Rule], ahead of every list
DOMAIN-SUFFIX,base.org,💰 加密货币
# 局域网和本地。no-resolve: Surge resolves a domain at the first IP rule it reaches, and this set sits
# ahead of nearly every list, so without it each request is resolved locally first and the later
# no-resolve IP rules (Twitter, Facebook, ...) then match that answer. Private IP literals still match.
RULE-SET,https://raw.githubusercontent.com/wenbingkun/proxy-config/main/surge/rules/local_network.list,DIRECT,no-resolve
# 软件下载直连补充规则
