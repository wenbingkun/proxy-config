# Surge iOS local bootstrap template. Copy it to bootstrap.conf in iCloud Drive/Surge and select
# bootstrap.conf as the active profile. Keep subscription, MitM, SSID and airport DNS out of Git.
#
# Files next to it on the device (iCloud Drive/Surge):
#   proxy-config.conf  managed profile installed from
#                      https://raw.githubusercontent.com/wenbingkun/proxy-config/main/surge/proxy-config.conf
#   Airport.conf       the airport's full Surge profile (its [Proxy] section is used)
#   airport-dns.sgmodule  local module from surge/airport-dns.example.sgmodule: the airport's
#                      required DNS (its encrypted-dns-server) for every lookup, nodes included
# Replace HOME_SSID below with the home Wi-Fi name. If the 2.4G and 5G names differ, add one
# [SSID Setting] line per name and use a wildcard SSID in the module arguments.

[General]
#!include proxy-config.conf

[Proxy]
#!include Airport.conf

[Proxy Group]
#!include proxy-config.conf

[Rule]
#!include proxy-config.conf

[Host]
#!include proxy-config.conf

[SSID Setting]
# At home, resolve through the router (ShellCrash). Surge documents system and off for these keys.
# A space separates the network from its parameters, so the parameters take commas without spaces.
# For an SSID with spaces, write each space as ? (one-character wildcard), here and in the modules.
SSID:HOME_SSID dns-server=system,encrypted-dns-server=off

[MITM]
skip-server-cert-verify = false
h2 = true
ca-passphrase =
ca-p12 =
hostname =
