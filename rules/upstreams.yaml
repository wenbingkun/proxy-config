# Offline resource classification. Versions remain in configs/build sources.
# Regexes are full matches and only apply in rule/icon fields, never script fields.
version: 1
rules:
  - 'https://cdn\.jsdelivr\.net/gh/blackmatrix7/ios_rule_script@master/rule/(QuantumultX|Loon|Surge)/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+\.list(#[^\s]*)?'
  - 'https://cdn\.jsdelivr\.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+\.yaml'
  - 'https://raw\.githubusercontent\.com/Cats-Team/AdRules/main/(qx\.conf|adrules\.list|adrules-surge\.conf)'
  - 'https://cdn\.jsdelivr\.net/gh/Loyalsoldier/clash-rules@release/(direct|lancidr|private|proxy)\.txt'
  - 'https://cdn\.jsdelivr\.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/[a-z0-9-]+\.yaml'
  - 'https://raw\.githubusercontent\.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/[a-z0-9-]+\.yaml'
  - 'https://malware-filter\.gitlab\.io/malware-filter/urlhaus-filter-domains\.txt'
icons:
  - 'https://cdn\.jsdelivr\.net/gh/Koolson/Qure@master/IconSet/Color/[A-Za-z0-9_-]+\.png'
  - 'https://is1-ssl\.mzstatic\.com/image/thumb/[^\s?#]+\.png/100x100bb\.png'
  - 'https://raw\.githubusercontent\.com/fmz200/wool_scripts/[0-9a-f]{40}/icons/apps/[A-Za-z0-9_-]+\.png'
  - 'https://raw\.githubusercontent\.com/deezertidal/private/main/icons/biliad\.png'
