# QX only (2026-10-06): the handlers on installed apps that ddgksf2013's StartUpAds 2.0 had and nothing
# else in this setup covers (evidence/startup-gap.json). Umetrip: its startup/discardrp native calls were
# rejected by 2.0, which sat before UmetripAds; this file takes 2.0's place in the list. 神州租车: the
# marketing placement got an empty dict from ddgksf2013's dict.js. 2.0's umetrip.com.cn header script is
# not carried over: 2.0 never decrypted umetrip.com.cn, so it did not run on HTTPS.

hostname = startup.umetrip.com, discardrp.umetrip.com, apiproxy.zuche.com

^https?:\/\/(discardrp|startup)\.umetrip\.com\/gateway\/api\/umetrip\/native url reject-200
^https?:\/\/apiproxy\.zuche\.com\/resource\/cardes\/toufang\/marketing url reject-dict
