# Quantumult X version of Maasea's Surge module YouTube (Music) Enhance (Apache-2.0):
# https://raw.githubusercontent.com/Maasea/sgmodule/65075cdb388fc5e3094afd7e7314c67b243f3525/YouTube.Enhance.sgmodule
# Written by hand on 2026-10-05 to replace ddgksf2013's YoutubeAds.conf, which loads the same
# youtube.response.js from Maasea's master branch. Kept: the module's http-response script and its
# youtubei MitM host, pinned to the commit surge/modules/rewrite/youtube.sgmodule is built from.
# Endpoints are the module's minus log_event and config: the list ddgksf2013's QX rewrite runs this
# script on (in use on QX until 2026-10-05). The module's http-request script (captions) is not
# ported. QX passes no arguments, so the script's defaults apply.
# Not kept: ddgksf2013's googlevideo.com and www/s.youtube.com rejects, or the module's googlevideo
# initplayback request script and MitM. This version only processes player/API responses; caption
# handling from the request script is not ported. To refresh, compare with the module again.

hostname = youtubei.googleapis.com

^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch)(\?(.*))?$ url script-response-body https://raw.githubusercontent.com/Maasea/sgmodule/65075cdb388fc5e3094afd7e7314c67b243f3525/Script/Youtube/youtube.response.js
