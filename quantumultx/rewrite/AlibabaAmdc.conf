# 阿里系 amdc (2026-10-06): runs this repo's quantumultx/scripts/amdc.js on Alibaba apps' plain-HTTP
# AMDC dispatch (no MitM needed). It replaces the copies of ddgksf2013's amdc.js that came with the
# ddgksf2013 AMap, Xianyu, DaMai and StartUpAds rewrites, so that one rewrite in each client handles it.
# Same match as ddgksf2013's StartUpAds rule (any host, plain HTTP).

^http:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,4}(:\d+)?\/amdc\/mobileDispatch url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/amdc.js
