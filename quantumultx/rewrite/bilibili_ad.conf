# Frozen copy of the Bilibili rewrite this repo used before 2026-09-29:
# deezertidal/QuantumultX-Rewrite rewrite/biliad.conf (last changed 2023-06-08),
# itself a repost of ddgksf2013 (墨鱼) rules. Only deviations from the original:
#   - dead deezertidal/private bilibili_json.js links -> quantumultx/scripts/bilibili_json.js
#     (ddgksf2013/Scripts @ 31d094a, see that file header);
#   - the active Bilibili_CC.conf line (404, and hdslb.com was never in hostname) is commented out;
#   - app2smile and yjqiang script links pinned to the commits current on 2026-09-30.
#   - hostname is comma-separated: the original space-separated list did not take effect
#     in QX (B 站 ads came back once the device-local *.bilibili.com MitM entry was removed);
#     grpc.biliapi.net is left out on purpose, decrypting it slows Bilibili down in QX and no
#     rule here matches that host.
# Not maintained upstream anymore; load with opt-parser=true as before.

#!name=哔哩哔哩去广告
#!desc=哔哩哔哩去广告
#!icon=https://raw.githubusercontent.com/deezertidal/private/main/icons/biliad.png
#!homepage=https://yfamily.ml
#!author=ddgksf2013


hostname = app.bilibili.com, api.live.bilibili.com, api.vc.bilibili.com, api.bilibili.com, manga.bilibili.com, api.biliapi.net, -broadcast.chat.bilibili.com, -*cdn*.biliapi.net, -*tracker*.biliapi.net


#～BiliBili_哔哩哔哩_屏蔽IP请求@ddgksf2013
^https?:\/\/app\.bilibili\.com\/x\/resource\/ip url reject
#～BiliBili_哔哩哔哩_屏蔽DefaultWord@ddgksf2013
^https?:\/\/app\.bilibili\.com\/bilibili\.app\.interface\.v1\.Search\/Default url reject
#～BiliBili_哔哩哔哩_屏蔽首页右上活动[卸载重装]@ddgksf2013
^https?:\/\/app\.bilibili\.com\/x\/resource\/top\/activity url reject-dict
#～BiliBili_哔哩哔哩_应用开屏去广告@bm7
^https://app.bilibili.com/x/v2/splash/show url reject-dict
#～BiliBili_哔哩哔哩_Defaultword@ddgksf2013
^https://app.bilibili.com/x/v2/search/defaultwords url reject-dict
#～BiliBili_哔哩哔哩_Material_Ad@ddgksf2013
^https?:\/\/api\.bilibili\.com\/x\/vip\/ads\/material\/report url reject-dict
#～BiliBili_哔哩哔哩_小卡片广告@ddgksf2013
^https://api.bilibili.com/pgc/season/player/cards url reject-dict
#～BiliBili_哔哩哔哩_解除SIM卡地区限制
(^https?:\/\/app\.biliintl.com\/intl\/.+)(&sim_code=\d+)(.+)-302$1$3
#～BiliBili_哔哩哔哩_去除搜索中的大家都在搜@bm7
^https?:\/\/api\.vc\.bilibili\.com\/search_svr\/v\d\/Search\/recommend_words url reject
#～BiliBili_哔哩哔哩_去除动态中的话题@bm7
^https?:\/\/api\.vc\.bilibili\.com\/topic_svr\/v1\/topic_svr url reject-dict
#～BiliBili_哔哩哔哩_可能的一些推广(beta)@bm7
^https?:\/\/api\.bilibili\.com\/pgc\/season\/app\/related\/recommend\? url reject-dict
#～BiliBili_哔哩哔哩_漫画去广告@ddgksf2013
^https?:\/\/manga\.bilibili\.com\/twirp\/comic\.v\d\.Comic\/(Flash|ListFlash) url reject-dict


#～BiliBili_哔哩哔哩_繁体CC字幕转中文简体[自行启用]@ddgksf2013
# ^https?:\/\/i.\.hdslb\.com\/bfs\/subtitle\/.+\.json$ url script-response-body https://github.com/deezertidal/private/raw/master/js-backup/Rewrite/Function/Bilibili_CC.conf
#～BiliBili_哔哩哔哩_观影页面去广告@ddgksf2013
^https?:\/\/api\.(bilibili|biliapi)\.(com|net)\/pgc\/page\/cinema\/tab\? url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_应用开屏广告预加载@yjqiang
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_去除统一设置的皮肤@ddgksf2013
^https?:\/\/app\.bilibili\.com\/x\/resource\/show\/skin\? url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_1080P高码率+4K画质(番剧和影视除外)@ddgksf2013
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/myinfo\? url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_热搜发现@ddgksf2013
^https://app.bilibili.com/x/v2/search/square url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_推荐去广告@ddgksf2013
^https?:\/\/app\.bilibili\.com\/x\/v2\/feed\/index url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_追番去广告@ddgksf2013
^https?:\/\/api\.(bilibili|biliapi)\.(com|net)\/pgc\/page\/bangumi url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_直播去广告@bm7
^https?:\/\/api\.live\.bilibili\.com\/xlive\/app-room\/v1\/index\/getInfoByRoom url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_动态去广告@bm7
^https?:\/\/api\.vc\.bilibili\.com\/dynamic_svr\/v1\/dynamic_svr\/dynamic_(history|new)\? url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_标籤页处理@ddgksf2013
^https?:\/\/app\.bilibili\.com\/x\/resource\/show\/tab url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_我的页面处理@ddgksf2013
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/mine url script-response-body https://raw.githubusercontent.com/wenbingkun/proxy-config/main/quantumultx/scripts/bilibili_json.js
#～BiliBili_哔哩哔哩_Proto去广告@app2smile
^https:\/\/app\.bilibili\.com\/bilibili\.app\.(view\.v1\.View\/View|dynamic\.v2\.Dynamic\/DynAll)$ url script-response-body https://raw.githubusercontent.com/app2smile/rules/df6366a7024e0b3f0aa3510c5b791eea6f3cba89/js/bilibili-proto.js
#～BiliBili_哔哩哔哩_动态广告@yjqiang
^https://app\.bilibili\.com/bilibili\.app\.dynamic\.v2\.Dynamic/DynAll$ url script-response-body https://raw.githubusercontent.com/yjqiang/surge_scripts/ae855a8935e8a770780c9cb11d6830176e895131/scripts/bilibili/bilibili_dynamic.js
#～BiliBili_哔哩哔哩_繁体CC字幕转中文简体[自行启用]@ddgksf2013
# ^https?:\/\/i.\.hdslb\.com\/bfs\/subtitle\/.+\.json$ url script-response-body https://github.com/deezertidal/private/raw/master/js-backup/Rewrite/Function/Bilibili_CC.conf
