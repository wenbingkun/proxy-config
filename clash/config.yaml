    <<: *fallback_group
    tolerance: 50
    timeout: 8000
    filter: "(?i)南极|antarctica|antarctic"

rule-providers:
  AdBlock: {type: http, behavior: domain, format: yaml, interval: 86400, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt", path: ./cache/rulesets/AdBlock.yaml}
  AdGuard: {type: http, behavior: classical, format: yaml, interval: 86400, url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Advertising/Advertising.yaml", path: ./cache/rulesets/AdGuard.yaml}
  PrivateDomain: {type: http, behavior: domain, format: yaml, interval: 86400, url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt", path: ./cache/rulesets/PrivateDomain.yaml}
  Tracking: {type: http, behavior: classical, format: yaml, interval: 86400, url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Privacy/Privacy.yaml", path: ./cache/rulesets/Tracking.yaml}
