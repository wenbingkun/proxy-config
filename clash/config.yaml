    filter: "(?i)中亚|中亞|蒙古|哈萨克|乌兹别克|吉尔吉斯|塔吉克|土库曼|(^|[^a-z])(central ?asia|mongolia|kazakhstan|uzbekistan|kyrgyzstan|tajikistan|turkmenistan)([^a-z]|$)"
  - name: 🇪🇺 欧洲节点
