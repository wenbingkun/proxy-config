    filter: "(?i)大洋洲|斐济|巴布亚新几内亚|新喀里多尼亚|法属波利尼西亚|萨摩亚|汤加|瓦努阿图|所罗门群岛|基里巴斯|瑙鲁|帕劳|密克罗尼西亚|马绍尔群岛|关岛|美属萨摩亚|北马里亚纳|库克群岛|纽埃|诺福克岛|托克劳|瓦立斯|(^|[^a-z])(oceania|fiji|papua|caledonia|polynesia|samoa|tonga|vanuatu|solomon|kiribati|nauru|palau|micronesia|marshall|guam|mariana|cook ?islands|niue|norfolk|tokelau|wallis)([^a-z]|$)"
  - name: 🌎 南美节点
