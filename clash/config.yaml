    tolerance: 50
    filter: "(?i)欧洲|歐洲|法国|德国|荷兰|意大利|西班牙|瑞士|俄罗斯|丹麦|挪威|瑞典|芬兰|捷克|波兰|比利时|奥地利|匈牙利|斯洛伐克|斯洛文尼亚|克罗地亚|波黑|塞尔维亚|黑山|北马其顿|阿尔巴尼亚|保加利亚|罗马尼亚|乌克兰|白俄罗斯|立陶宛|拉脱维亚|爱沙尼亚|冰岛|爱尔兰|葡萄牙|希腊|马耳他|塞浦路斯|卢森堡|摩纳哥|安道尔|圣马力诺|梵蒂冈|列支敦士登|摩尔多瓦|格鲁吉亚|亚美尼亚|阿塞拜疆|直布罗陀|法罗群岛|奥兰群岛|马恩岛|根西岛|泽西岛|(^|[^a-z])(eu|europe|france|germany|netherlands|italy|spain|switzerland|russia|denmark|norway|sweden|finland|czech|poland|belgium|austria|hungary|slovakia|slovenia|croatia|bosnia|serbia|montenegro|macedonia|albania|bulgaria|romania|ukraine|belarus|lithuania|latvia|estonia|iceland|ireland|portugal|greece|malta|cyprus|luxembourg|monaco|andorra|vatican|liechtenstein|moldova|georgia|armenia|azerbaijan|gibraltar|nl|ru|de|ch|fr|se|bg|at|ie|hu)([^a-z]|$)"
  - name: 🏝️ 大洋洲节点
