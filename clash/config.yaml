  - name: 🕌 中东节点
    <<: *fallback_group
    tolerance: 50
    filter: "(?i)中东|中東|阿联酋|阿聯酋|沙特|土耳其|伊朗|伊拉克|以色列|巴勒斯坦|约旦|黎巴嫩|叙利亚|科威特|卡塔尔|巴林|阿曼|也门|(^|[^a-z])(middle ?east|uae|united ?arab ?emirates|saudi|turkey|iran|iraq|israel|palestine|jordan|lebanon|syria|kuwait|qatar|bahrain|oman|yemen|ae|tr)([^a-z]|$)"
